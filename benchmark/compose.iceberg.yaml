services:

  polaris-bootstrap:
    image: apache/polaris-admin-tool:latest
    environment:
      - POLARIS_PERSISTENCE_TYPE=relational-jdbc
      - QUARKUS_DATASOURCE_JDBC_URL=${QUARKUS_DATASOURCE_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=${QUARKUS_DATASOURCE_USERNAME}
      - QUARKUS_DATASOURCE_PASSWORD=${QUARKUS_DATASOURCE_PASSWORD}
    command:
      - "bootstrap"
      - "--realm=${POLARIS_REALM}"
      - "--credential=${POLARIS_REALM},${POLARIS_CLIENT_ID},${POLARIS_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy

  polaris:
    image: apache/polaris:latest
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      ROOT_DIR: $ROOT_DIR
      JAVA_DEBUG: true
      POLARIS_PERSISTENCE_TYPE: $POLARIS_PERSISTENCE_TYPE
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: $POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: $POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: $POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS
      QUARKUS_DATASOURCE_JDBC_URL: $QUARKUS_DATASOURCE_JDBC_URL
      QUARKUS_DATASOURCE_USERNAME: $QUARKUS_DATASOURCE_USERNAME
      QUARKUS_DATASOURCE_PASSWORD: $QUARKUS_DATASOURCE_PASSWORD
      QUARKUS_LOG_LEVEL: $QUARKUS_LOG_LEVEL 
      QUARKUS_LOG_CONSOLE_JSON_ENABLED: $QUARKUS_LOG_CONSOLE_JSON_ENABLED
      QUARKUS_LOG_FILE_JSON_ENABLED: $QUARKUS_LOG_FILE_JSON_ENABLED 
      POLARIS_REALM_CONTEXT_REALMS: $POLARIS_REALM
      QUARKUS_OTEL_SDK_DISABLED: $QUARKUS_OTEL_SDK_DISABLED
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,$POLARIS_CLIENT_ID,$POLARIS_SECRET
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": $POLARIS_FEATURES_ALLOW_INSECURE_STORAGE_TYPES
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": $POLARIS_FEATURES_SUPPORTED_CATALOG_STORAGE_TYPES
      polaris.readiness.ignore-severe-issues: $POLARIS_READINESS_IGNORE_SEVERE_ISSUES
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  polaris-setup:
    image: alpine/curl
    environment:
      # STORAGE_LOCATION: $ICEBERG_STORAGE_LOCATION
      # - AWS_ROLE_ARN=${AWS_ROLE_ARN}
      # - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      REALM: $POLARIS_REALM
      CLIENT_ID: $POLARIS_CLIENT_ID
      CLIENT_SECRET: $POLARIS_SECRET
      CATALOG_NAME: $ICEBERG_CATALOG_NAME
    volumes:
      - ${ASSETS_PATH}/polaris/:/polaris
    entrypoint: '/bin/sh -c "chmod +x /polaris/create-catalog.sh && /polaris/create-catalog.sh"'
    depends_on:
      polaris:
        condition: service_healthy